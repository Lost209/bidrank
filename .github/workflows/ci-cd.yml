name: CI/CD & Deployment Readiness Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Production Build
        run: npm run build

      - name: Run Headless Verification Suite
        run: |
          npm run start &
          sleep 5
          APP_URL=http://localhost:3005 node scripts/headless-launch.mjs
